  :root{
    --navy-deep:#0C0C0C;
    --navy-panel:#1A1A1A;
    --navy-line:#3D3B3A;
    --gold:#E0432A;
    --gold-dim:#8C3322;
    --coral:#F2704A;
    --cream:#F5F1E8;
    --cream-dim:#9C9992;
    --blue-tag:#5B8DEF;
    --purple-tag:#A57BE0;
    --pink-tag:#F17FAF;
    --red-tag:#E85A5A;
    --black-tag:#2B2B2B;

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, rgba(224,67,42,0.14), transparent 45%),
      radial-gradient(ellipse at 90% 0%, rgba(242,112,74,0.08), transparent 40%),
      var(--navy-deep);
    color:var(--cream);
    font-family:"Noto Sans TC","Noto Sans KR",sans-serif;
    min-height:100vh;
    padding-bottom:60px;

  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 0;}

  /* header */
  .masthead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--navy-line);padding-bottom:14px;margin-bottom:18px;}
  .masthead h1{
    font-family:"Noto Serif TC";font-weight:900;font-size:22px;letter-spacing:1px;margin:0;color:var(--cream);
  }
  .masthead .route{font-family:"Space Mono";font-size:12px;color:var(--gold);letter-spacing:2px;}

  /* tabs */
  .tabbar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 16px;scrollbar-width:thin;}
  .tabbar::-webkit-scrollbar{height:5px;}
  .tabbar::-webkit-scrollbar-thumb{background:var(--navy-line);border-radius:3px;}
  .tab{
    flex:0 0 auto;
    font-family:"Space Mono";
    font-size:12px;
    color:var(--cream-dim);
    background:var(--navy-panel);
    border:1px solid var(--navy-line);
    border-radius:3px;
    padding:8px 12px;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
    text-align:left;
    line-height:1.3;
  }
  .tab .d{font-weight:700;color:var(--cream);display:block;font-size:13px;}
  .tab .w{color:var(--cream-dim);font-size:10px;}
  .tab.active{
    background:linear-gradient(180deg, rgba(224,67,42,0.20), rgba(224,67,42,0.05));
    border-color:var(--gold);
  }
  .tab.active .d{color:var(--gold);}
  .tab:hover{border-color:var(--gold-dim);}

  .panel{display:none;}
  .panel.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* countdown board */
  .board{
    background:var(--navy-panel);
    border:1px solid var(--navy-line);
    border-radius:6px;
    padding:26px 22px;
    text-align:center;
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
  }
  .board:before{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,255,255,0.012) 3px, rgba(255,255,255,0.012) 4px);
    pointer-events:none;
  }
  .board .eyebrow{font-family:"Space Mono";font-size:11px;letter-spacing:3px;color:var(--gold-dim);text-transform:uppercase;}
  .dday{
    font-family:"Space Mono";font-weight:700;
    font-size:64px;color:var(--gold);
    letter-spacing:2px;
    margin:6px 0 2px;
    text-shadow:0 0 18px rgba(224,67,42,0.45);
  }
  .dday-sub{font-family:"Noto Serif TC";font-weight:700;font-size:15px;color:var(--cream);}
  .dday-hm{display:block;font-family:"Space Mono";font-weight:400;font-size:12px;color:var(--gold-dim);letter-spacing:1px;margin-top:4px;}

  /* boarding pass */
  .pass{
    display:flex;
    background:var(--navy-panel);
    border:1px solid var(--navy-line);
    border-radius:6px;
    margin-bottom:14px;
    overflow:hidden;

  .pass-main{flex:1;padding:16px 18px;}
  .pass-tag{
    width:78px;

    display:flex;align-items:center;justify-content:center;
    writing-mode:vertical-rl;
    font-family:"Space Mono";font-weight:700;font-size:12px;letter-spacing:3px;color:var(--gold);

  .pass-flight{font-family:"Space Mono";font-weight:700;font-size:18px;color:var(--gold);letter-spacing:1px;}
  .pass-date{font-family:"Space Mono";font-size:12px;color:var(--cream-dim);}

  .pass-arrow{color:var(--gold-dim);font-size:14px;}

  .day-head .weekday{font-family:"Space Mono";font-size:12px;color:var(--gold);letter-spacing:2px;margin-left:8px;}
  .day-head .area{font-family:"Noto Sans TC";font-size:13px;color:var(--cream-dim);margin-top:2px;}
  .day-notes{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .note-chip{font-family:"Space Mono";font-size:10px;background:rgba(224,67,42,0.14);border:1px solid var(--gold-dim);color:var(--gold);padding:3px 8px;border-radius:20px;}

  .item{position:relative;padding-bottom:20px;}
  .item:last-child{padding-bottom:2px;}

  .item.type-event .dot svg{stroke:var(--pink-tag);}

  .badge.purple{background:rgba(165,123,224,0.18);color:var(--purple-tag);border:1px solid rgba(165,123,224,0.4);}

  .summary-twd{font-family:"Space Mono";font-size:11px;color:var(--cream-dim);}

  .summary-net{font-family:"Space Mono";font-size:12.5px;font-weight:700;}

  .summary-net.owe{color:var(--gold);}

  .tool-card{

    border-radius:6px;
    padding:18px 20px 20px;
    margin-bottom:14px;

  .tool-title{
    font-family:"Noto Serif TC";font-weight:700;font-size:15px;color:var(--gold);
    margin-bottom:14px;

  .fx-row{display:flex;align-items:flex-end;gap:12px;}
  .fx-field{flex:1;display:flex;flex-direction:column;gap:6px;}
  .fx-field label{font-family:"Space Mono";font-size:10px;color:var(--cream-dim);letter-spacing:1px;}
  .fx-field input{
    font-family:"Space Mono";font-size:18px;font-weight:700;color:var(--cream);
    background:var(--navy-deep);border:1px solid var(--navy-line);border-radius:4px;
    padding:9px 10px;width:100%;

  .fx-field input:focus{outline:none;border-color:var(--gold);}
  .fx-eq{font-family:"Space Mono";color:var(--gold-dim);font-size:16px;padding-bottom:9px;}
  .fx-rate-row{
    display:flex;align-items:center;flex-wrap:wrap;gap:6px;
    margin-top:14px;padding-top:12px;border-top:1px dashed var(--navy-line);
    font-family:"Space Mono";font-size:11px;color:var(--cream-dim);
  }
  .fx-rate-row input{
    width:74px;font-family:"Space Mono";font-size:11px;color:var(--gold);
    background:var(--navy-deep);border:1px solid var(--navy-line);border-radius:3px;
    padding:4px 6px;
  }
  .fx-rate-row input:focus{outline:none;border-color:var(--gold);}
  .fx-hint{width:100%;font-family:"Noto Sans TC";font-size:10.5px;color:var(--gold-dim);margin-top:2px;}

  .checklist{display:flex;flex-direction:column;gap:2px;}
  .check-item{
    display:flex;align-items:center;gap:12px;
    padding:10px 4px;
    border-bottom:1px solid var(--navy-line);
    cursor:pointer;
    user-select:none;
  }
  .check-item:last-child{border-bottom:none;}
  .check-box{
    width:19px;height:19px;flex:0 0 19px;
    border:1px solid var(--gold-dim);border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    transition:all .15s ease;
  }
  .check-box svg{width:12px;height:12px;stroke:var(--navy-deep);opacity:0;stroke-width:3;transition:opacity .1s ease;}
  .check-item.checked .check-box{background:var(--gold);border-color:var(--gold);}
  .check-item.checked .check-box svg{opacity:1;}
  .check-label{font-family:"Noto Sans TC";font-size:14px;color:var(--cream);transition:color .15s ease;}
  .check-item.checked .check-label{color:var(--cream-dim);text-decoration:line-through;text-decoration-color:var(--navy-line);}
  .check-progress{
    margin-top:12px;font-family:"Space Mono";font-size:11px;color:var(--gold-dim);
    text-align:right;
  }

  footer.hint{
    text-align:center;font-family:"Space Mono";font-size:10px;color:var(--gold-dim);
    margin-top:26px;letter-spacing:1px;
  }

  @media (max-width:480px){
    .dday{font-size:48px;}
    .pass-time{font-size:21px;}
    .masthead h1{font-size:18px;}
  }
</style>

function renderExpenseBox(item, id){
  if(!item.expense) return '';
  const totalVal = lsGet('exp-total-'+id) || '';
  const payerVal = lsGet('exp-payer-'+id) || '';
  const payerOptions = `<option value="">墊付人未選</option>` + PEOPLE.map(p=>`<option value="${p}" ${payerVal===p?'selected':''}>${p}</option>`).join('');
  if(item.expense === 'even'){
    return `
    <div class="expense-box" data-id="${id}">
      <div class="exp-total-row">
        <label>花費 KRW</label>
        <input type="number" class="exp-total" data-id="${id}" data-mode="even" placeholder="0" min="0" value="${totalVal}">
        <span class="exp-hint">4人平分</span>
      </div>
      <div class="exp-payer-row">
        <label>墊付</label>
        <select class="exp-payer" data-id="${id}">${payerOptions}</select>
      </div>
      <div class="exp-split-row">
        ${PEOPLE.map(p=>`<div class="exp-person-cell"><span>${p}</span><input type="text" class="exp-person" data-person="${p}" data-id="${id}" readonly value="${lsGet('exp-person-'+id+'-'+p) || ''}"></div>`).join('')}
      </div>
    </div>`;
  }
  return `
  <div class="expense-box" data-id="${id}">
    <div class="exp-total-row">
      <label>花費 KRW</label>
      <input type="number" class="exp-total" data-id="${id}" data-mode="custom" placeholder="0" min="0" value="${totalVal}">
      <button type="button" class="exp-even-btn" data-id="${id}">平均分攤</button>
    </div>
    <div class="exp-payer-row">
      <label>墊付</label>
      <select class="exp-payer" data-id="${id}">${payerOptions}</select>
    </div>
    <div class="exp-split-row">
      ${PEOPLE.map(p=>`<div class="exp-person-cell"><span>${p}</span><input type="number" class="exp-person" data-person="${p}" data-id="${id}" placeholder="0" min="0" value="${lsGet('exp-person-'+id+'-'+p) || ''}"></div>`).join('')}
    </div>
  </div>`;
}

// ---- currency converter ----
const fxKrw = document.getElementById('fxKrw');
const fxTwd = document.getElementById('fxTwd');
const fxRate = document.getElementById('fxRate');
let fxLastEdited = 'krw';

function recalcFx(){
  const rate = parseFloat(fxRate.value) || 0;
  if(fxLastEdited === 'krw'){
    const krw = parseFloat(fxKrw.value);
    fxTwd.value = isNaN(krw) ? '' : (krw * rate).toFixed(1);
  } else {
    const twd = parseFloat(fxTwd.value);
    fxKrw.value = (isNaN(twd) || rate === 0) ? '' : Math.round(twd / rate);
  }
}
fxKrw.addEventListener('input', ()=>{ fxLastEdited='krw'; recalcFx(); });
fxTwd.addEventListener('input', ()=>{ fxLastEdited='twd'; recalcFx(); });
fxRate.addEventListener('input', recalcFx);

function currentFxRate(){
  const rateInput = document.getElementById('fxRate');
  const r = rateInput ? parseFloat(rateInput.value) : NaN;
  return isNaN(r) ? 0.0226 : r;
}

function updateSummary(){
  const rate = currentFxRate();
  let total = 0;
  document.querySelectorAll('.exp-total').forEach(inp=>{
    total += parseFloat(inp.value) || 0;
  });
  const owed = {}; PEOPLE.forEach(p=> owed[p] = 0);
  document.querySelectorAll('.exp-person').forEach(inp=>{
    const p = inp.dataset.person;
    if(owed.hasOwnProperty(p)) owed[p] += parseFloat(inp.value) || 0;
  });
  const paid = {}; PEOPLE.forEach(p=> paid[p] = 0);
  document.querySelectorAll('.exp-payer').forEach(sel=>{
    const payer = sel.value;
    if(payer && paid.hasOwnProperty(payer)){
      const totalInput = document.querySelector(`.exp-total[data-id="${sel.dataset.id}"]`);
      paid[payer] += totalInput ? (parseFloat(totalInput.value) || 0) : 0;
    }
  });
  document.getElementById('sumTotalKrw').textContent = Math.round(total).toLocaleString() + ' KRW';
  document.getElementById('sumTotalTwd').textContent = '≈ ' + Math.round(total * rate).toLocaleString() + ' TWD';
  PEOPLE.forEach(p=>{
    document.getElementById('owed-'+p).textContent = Math.round(owed[p]).toLocaleString() + ' KRW';
    document.getElementById('paidamt-'+p).textContent = Math.round(paid[p]).toLocaleString() + ' KRW';
    const net = paid[p] - owed[p];
    const netEl = document.getElementById('net-'+p);
    if(Math.abs(net) < 1){
      netEl.textContent = '已結清';
      netEl.className = 'summary-net even';
    } else if(net > 0){
      netEl.textContent = `應收回 ${Math.round(net).toLocaleString()} KRW（≈ ${Math.round(net*rate).toLocaleString()} TWD）`;
      netEl.className = 'summary-net get';
    } else {
      netEl.textContent = `尚須支付 ${Math.round(-net).toLocaleString()} KRW（≈ ${Math.round(-net*rate).toLocaleString()} TWD）`;
      netEl.className = 'summary-net owe';
    }
  });
}

document.addEventListener('input', e=>{
  if(e.target.classList.contains('exp-total')){
    lsSet('exp-total-'+e.target.dataset.id, e.target.value);
  }
  if(e.target.classList.contains('exp-total') && e.target.dataset.mode === 'even'){
    const id = e.target.dataset.id;
    const total = parseFloat(e.target.value) || 0;
    const share = total ? Math.round(total / PEOPLE.length) : '';
    document.querySelectorAll(`.exp-person[data-id="${id}"]`).forEach(inp=>{
      inp.value = share;
      lsSet('exp-person-'+id+'-'+inp.dataset.person, String(share));
    });
  }
  if(e.target.classList.contains('exp-person')){
    lsSet('exp-person-'+e.target.dataset.id+'-'+e.target.dataset.person, e.target.value);
  }
  if(e.target.id === 'fxRate'){
    lsSet('fxRate', e.target.value);
  }
  if(e.target.classList.contains('exp-total') || e.target.classList.contains('exp-person') || e.target.id === 'fxRate'){
    updateSummary();
  }
});

document.addEventListener('change', e=>{
  if(e.target.classList.contains('exp-payer')){
    lsSet('exp-payer-'+e.target.dataset.id, e.target.value);
    updateSummary();
  }
});

document.addEventListener('click', e=>{

    const total = totalInput ? (parseFloat(totalInput.value) || 0) : 0;
    const share = total ? Math.round(total / PEOPLE.length) : '';
    document.querySelectorAll(`.exp-person[data-id="${id}"]`).forEach(inp=>{
      inp.value = share;
      lsSet('exp-person-'+id+'-'+inp.dataset.person, String(share));
    });
    updateSummary();
  }
});

updateSummary();

// ---- countdown ----
function updateCountdown(){
  const target = new Date("2026-09-08T16:40:00+09:00");
  const now = new Date();
  const diffMs = target - now;
  const ddayEl = document.getElementById('ddayNum');
  const subEl = document.getElementById('ddaySub');
  if(diffMs <= 0){
    ddayEl.textContent = "D-DAY";
    subEl.textContent = "旅程進行中或已結束 · 祝順利！";
    return;
  }
  const days = Math.floor(diffMs / (1000*60*60*24));
  const hours = Math.floor((diffMs % (1000*60*60*24)) / (1000*60*60));
  const mins = Math.floor((diffMs % (1000*60*60)) / (1000*60));
  ddayEl.textContent = "D-" + days;
  subEl.innerHTML = `LASSGO PLAVE<span class="dday-hm">${hours} 小時 ${mins} 分</span>`;
}
updateCountdown();
setInterval(updateCountdown, 1000);
